name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test Firebase configuration
        run: cp .github/firebase/google-services.ci.json app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug assemble
        run: |
          chmod +x gradlew
          ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest assembleDebug --stacktrace
      - name: Assemble optimized release with R8
        run: ./gradlew :app:assembleRelease --stacktrace
