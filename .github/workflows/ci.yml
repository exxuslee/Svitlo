name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Unit tests and debug assemble
        run: |
          chmod +x gradlew
          ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest assembleDebug --stacktrace
